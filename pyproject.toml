[project]
name = "german-baking-site"
version = "0.1.0"
description = "Static site generator for 3pm German Baking"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.0",
    "pydantic>=2.12.5",
    "markdown>=3.7",
    "pyyaml>=6.0",
    "cssmin>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = []

[tool.djlint]
indent = 2
profile = "jinja"
ignore = "H021"
max_line_length = 140

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "ruff>=0.15.14",
]
