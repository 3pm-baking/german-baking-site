<head>
  {% include 'partials/analytics.html' %}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ post.meta_description }}">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="3pm German Baking">
  <meta property="og:title" content="{{ post.page_title }}">
  <meta property="og:description" content="{{ post.og_description }}">
  <meta property="og:url" content="https://germanbakingasheville.com/blog/{{ post.slug }}.html">
  {% if post.image %}
  <meta property="og:image" content="https://germanbakingasheville.com/images/{{ post.image }}">
  {% else %}
  <meta property="og:image" content="https://germanbakingasheville.com/images/logo.png">
  {% endif %}
  <meta property="og:image:alt" content="3pm German Baking — authentic German baking in Asheville, NC">
  <meta property="og:locale" content="en_US">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ post.page_title }}">
  <meta name="twitter:description" content="{{ post.og_description }}">
  {% if post.image %}
  <meta name="twitter:image" content="https://germanbakingasheville.com/images/{{ post.image }}">
  {% else %}
  <meta name="twitter:image" content="https://germanbakingasheville.com/images/logo.png">
  {% endif %}
  <meta name="twitter:image:alt" content="3pm German Baking — authentic German baking in Asheville, NC">

  <link rel="canonical" href="https://germanbakingasheville.com/blog/{{ post.slug }}.html">

  <title>{{ post.page_title }}</title>

  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">

  <!-- Article Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ post.title | tojson }},
    "description": {{ post.og_description | tojson }},
    "image": "https://germanbakingasheville.com/images/{{ post.image if post.image else 'logo.png' }}",
    "datePublished": "{{ post.date }}",
    "dateModified": "{{ post.date }}",
    "author": {
      "@type": "Person",
      "name": {{ post.author | tojson }}
    },
    "publisher": {
      "@type": "Organization",
      "name": "3pm German Baking",
      "logo": {
        "@type": "ImageObject",
        "url": "https://germanbakingasheville.com/images/logo.png"
      }
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "https://germanbakingasheville.com/blog/{{ post.slug }}.html"
    }
    {% if post.tags %}
    ,"keywords": {{ post.tags | join(', ') | tojson }}
    {% endif %}
  }
  </script>

  <!-- Breadcrumb Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://germanbakingasheville.com/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Blog",
        "item": "https://germanbakingasheville.com/blog/"
      },
      {
        "@type": "ListItem",
        "position": 3,
        "name": {{ post.title | tojson }},
        "item": "https://germanbakingasheville.com/blog/{{ post.slug }}.html"
      }
    ]
  }
  </script>
</head>
