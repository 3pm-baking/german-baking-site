<head>
  {% include 'partials/analytics.html' %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ post.meta_description }}">
  <meta name="author" content="{{ post.author }}">
  <meta name="robots" content="max-image-preview:large">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="3pm German Baking">
  <meta property="og:title" content="{{ post.page_title }}">
  <meta property="og:description" content="{{ post.og_description }}">
  <meta property="og:url"
        content="https://germanbakingasheville.com/blog/{{ post.slug }}.html">
  {% if post.image %}
    <meta property="og:image"
          content="https://germanbakingasheville.com/images/{{ post.image }}">
  {% else %}
    <meta property="og:image"
          content="https://germanbakingasheville.com/images/logo.png">
  {% endif %}
  <meta property="og:image:width" content="400">
  <meta property="og:image:height" content="400">
  <meta property="og:image:alt"
        content="3pm German Baking — authentic German baking in Asheville, NC">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ post.page_title }}">
  <meta name="twitter:description" content="{{ post.og_description }}">
  {% if post.image %}
    <meta name="twitter:image"
          content="https://germanbakingasheville.com/images/{{ post.image }}">
  {% else %}
    <meta name="twitter:image"
          content="https://germanbakingasheville.com/images/logo.png">
  {% endif %}
  <meta name="twitter:image:alt"
        content="3pm German Baking — authentic German baking in Asheville, NC">
  <meta property="article:published_time"
        content="{{ post.date }}T00:00:00-05:00">
  <meta property="article:modified_time"
        content="{{ post.updated_date if post.updated_date else post.date }}T00:00:00-05:00">
  <meta property="article:author" content="{{ post.author }}">
  {% if post.tags %}
    {% for tag in post.tags %}<meta property="article:tag" content="{{ tag }}">{% endfor %}
  {% endif %}
  <link rel="canonical"
        href="https://germanbakingasheville.com/blog/{{ post.slug }}.html">
  <link rel="alternate"
        type="application/rss+xml"
        href="/feed.xml"
        title="3pm German Baking Blog">
  <title>{{ post.page_title }}</title>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
        media="print"
        onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
  </noscript>
  <link rel="stylesheet" href="../styles.min.css">
  {% if post.has_code %}
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
          media="print"
          onload="this.media='all'">
    <noscript>
      <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    </noscript>
  {% endif %}
  <meta name="theme-color" content="#1a1a1a">
  <!-- Article Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "inLanguage": "en-US",
    "headline": {{ post.title | tojson }},
    "description": {{ post.og_description | tojson }},
    "image": "https://germanbakingasheville.com/images/{{ post.image if post.image else 'logo.png' }}",
    "datePublished": "{{ post.date }}T00:00:00-05:00",
    "dateModified": "{{ post.updated_date if post.updated_date else post.date }}T00:00:00-05:00",
    "author": {
      "@type": "Person",
      "name": {{ post.author | tojson }},
      "url": "https://germanbakingasheville.com/"
    },
    "publisher": {
      "@type": "Organization",
      "name": "3pm German Baking",
      "logo": {
        "@type": "ImageObject",
        "url": "https://germanbakingasheville.com/images/logo.png"
      },
      "sameAs": [
        "https://instagram.com/3pmgermanbaking"
      ]
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "https://germanbakingasheville.com/blog/{{ post.slug }}.html"
    }
    {% if post.tags %}
    ,"keywords": {{ post.tags | join(', ') | tojson }}
    ,"about": [{% for tag in post.tags %}{"@type": "Thing", "name": "{{ tag }}"}{% if not loop.last %},{% endif %}{% endfor %}]
    {% endif %}
    ,"wordCount": {{ post.word_count }}
    ,"contentLocation": {
      "@type": "Place",
      "name": "Asheville, North Carolina",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Asheville",
        "addressRegion": "NC",
        "addressCountry": "US"
      }
    }
  }
  </script>
  <!-- Breadcrumb Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://germanbakingasheville.com/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Blog",
        "item": "https://germanbakingasheville.com/blog/"
      },
      {
        "@type": "ListItem",
        "position": 3,
        "name": {{ post.title | tojson }},
        "item": "https://germanbakingasheville.com/blog/{{ post.slug }}.html"
      }
    ]
  }
  </script>
</head>
