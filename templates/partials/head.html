<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.meta_description }}">
  
  <meta property="og:type" content="product">
  <meta property="og:title" content="{{ page.page_title }}">
  <meta property="og:description" content="{{ page.og_description }}">
  <meta property="og:url" content="https://germanbakingasheville.com/products/{{ page.slug }}.html">
  <meta property="og:image" content="https://germanbakingasheville.com/images/{{ page.image }}">
  <meta property="og:locale" content="en_US">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.page_title }}">
  <meta name="twitter:description" content="{{ page.og_description }}">
  <meta name="twitter:image" content="https://germanbakingasheville.com/images/{{ page.image }}">

  <link rel="canonical" href="https://germanbakingasheville.com/products/{{ page.slug }}.html">
  
  <title>{{ page.page_title }}</title>
  
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "{{ page.title }}",
    "alternateName": "{{ page.german_name }}",
    "description": "{{ page.description }}",
    "image": "https://germanbakingasheville.com/images/{{ page.image }}",
    "brand": {
      "@type": "Brand",
      "name": "3pm German Baking"
    }
  }
  </script>
</head>
