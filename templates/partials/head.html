<head>
  {% include 'partials/analytics.html' %}
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.meta_description }}">
  
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="3pm German Baking">
  <meta property="og:title" content="{{ page.page_title }}">
  <meta property="og:description" content="{{ page.og_description }}">
  <meta property="og:url" content="https://germanbakingasheville.com/products/{{ page.slug }}.html">
  <meta property="og:image" content="https://germanbakingasheville.com/images/logo.png">
  <meta property="og:image:alt" content="3pm German Baking logo — authentic German baking in Asheville, NC">
  <meta property="og:locale" content="en_US">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.page_title }}">
  <meta name="twitter:description" content="{{ page.og_description }}">
  <meta name="twitter:image" content="https://germanbakingasheville.com/images/logo.png">
  <meta name="twitter:image:alt" content="3pm German Baking logo — authentic German baking in Asheville, NC">

  <link rel="canonical" href="https://germanbakingasheville.com/products/{{ page.slug }}.html">
  
  <title>{{ page.page_title }}</title>
  
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  
  <!-- Enhanced Product Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": {{ page.title | tojson }},
    "alternateName": {{ page.german_name | tojson }},
    "description": {{ page.description | tojson }},
    "image": "https://germanbakingasheville.com/images/{{ page.image }}",
    "brand": {
      "@type": "Brand",
      "name": "3pm German Baking"
    },
    "offers": {
      "@type": "Offer",
      "priceCurrency": "USD",
      "price": "{{ page.price if page.price is not none else 0 }}",
      "priceValidUntil": "2099-12-31",
      "availability": "https://schema.org/InStock",
      "itemCondition": "https://schema.org/NewCondition",
      "url": "https://germanbakingasheville.com/products/{{ page.slug }}.html",
      "seller": {
        "@type": "Organization",
        "name": "3pm German Baking",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Asheville",
          "addressRegion": "NC",
          "postalCode": "28806",
          "addressCountry": "US"
        }
      },
      "areaServed": {
        "@type": "GeoCircle",
        "geoMidpoint": {
          "@type": "GeoCoordinates",
          "latitude": "35.5951",
          "longitude": "-82.5515"
        },
        "geoRadius": "50000"
      }
    },
    "category": "Bakery Products",
    "inLanguage": "en-US"
  }
  </script>
  
  <!-- Breadcrumb Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://germanbakingasheville.com/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Products",
        "item": "https://germanbakingasheville.com/#products"
      },
      {
        "@type": "ListItem",
        "position": 3,
        "name": {{ page.title | tojson }},
        "item": "https://germanbakingasheville.com/products/{{ page.slug }}.html"
      }
    ]
  }
  </script>
</head>
