name: Build & Deploy

on:
  schedule:
    - cron: '0 5 * * *'  # midnight ET (UTC-5)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: uv run python build.py

      - name: Verify build is up to date
        run: |
          if ! git diff --quiet; then
            echo "ERROR: Generated files are out of date. Run 'uv run python build.py' locally and commit the results."
            git diff --stat
            exit 1
          fi
