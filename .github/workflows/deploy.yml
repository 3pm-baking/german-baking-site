name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * *'  # 8am ET (UTC-5)

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: uv run python build.py

      - name: Remove source files before deploy
        # Build source isn't part of the public site; anything missed here gets
        # served at the site root (site repo #69: mdext/ and preorder_checks.py
        # were publicly served until this list was extended).
        run: |
          rm -rf content/ templates/ scripts/ .agents/ .github/ mdext/ tests/ node_modules/
          rm -f build.py pyproject.toml Makefile uv.lock .python-version AGENTS.md TODO.md test.md preorder_checks.py package.json package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
