name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'  # midnight ET (UTC-5)

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: uv run python build.py

      - name: Remove source files before deploy
        run: |
          rm -rf content/ templates/ scripts/ .agents/ .github/
          rm -f build.py pyproject.toml Makefile uv.lock .python-version AGENTS.md TODO.md test.md
          rm -f sync_also_available.py sync_locations.py sync_products.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
