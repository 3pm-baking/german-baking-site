name: Sync Recipes from Finances

on:
  repository_dispatch:
    types: [sync-recipes]

concurrency:
  group: sync-recipes
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check for duplicate products
        run: uv run pre-commit run check-duplicate-products --all-files

      - name: Write product files from payload
        id: write_products
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: uv run python scripts/sync_products.py

      - name: Write location files from payload
        id: write_locations
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: uv run python scripts/sync_locations.py

      - name: Determine if any changes
        id: changes
        run: |
          products="${{ steps.write_products.outputs.has_changes }}"
          locations="${{ steps.write_locations.outputs.locations_has_changes }}"
          if [[ "$products" == "true" || "$locations" == "true" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale sync PRs
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Find and close any open sync PRs, deleting their branches
          gh pr list \
            --search "sync: update products and locations in:title" \
            --state open \
            --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"' \
          | while read -r number branch; do
              echo "Closing stale sync PR #${number} (branch: ${branch})"
              gh pr close "$number" --delete-branch
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="sync/recipes-${DATE}-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add content/products/ content/locations/
          # Only commit content — never workflow files
          git restore --staged .github/ 2>/dev/null || true
          git commit -m "sync: update products and locations ${DATE}"

          # Rebuild site from updated content files
          uv run python build.py
          git add index.html sitemap.xml products/ blog/
          git diff --staged --quiet || git commit -m "chore: rebuild site after sync ${DATE}"

          git push origin "$BRANCH"

          BODY=$(cat /tmp/pr-summary.md)
          gh pr create \
            --title "sync: update products and locations ${DATE}" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH" \
            --reviewer williambdean
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes
        if: steps.changes.outputs.has_changes != 'true'
        run: echo "All products and locations are up to date — no PR needed."
