name: Sync Recipes from Finances

on:
  repository_dispatch:
    types: [sync-recipes]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Write product files from payload
        id: write
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import yaml
          from pathlib import Path

          payload = json.loads(os.environ["PAYLOAD"])
          products = payload["products"]
          base = Path("content/products")

          created, updated, skipped = [], [], []

          for product in products:
              slug = product["slug"]
              update = {k: v for k, v in product.items() if k != "slug"}

              # Search all directories for an existing file matching this slug.
              # A product will only ever live in one directory, never both.
              existing_path = None
              for search_dir in ["oven", "pantry", "also-available"]:
                  for f in sorted((base / search_dir).glob("*.yml")):
                      if slug in f.stem:
                          existing_path = f
                          break
                  if existing_path:
                      break

              if existing_path:
                  # Merge into the existing file wherever it lives.
                  # Preserve all existing fields; overwrite with incoming fields.
                  existing = yaml.safe_load(existing_path.read_text()) or {}
                  merged = {**existing, **update}
                  content = yaml.dump(merged, allow_unicode=True, default_flow_style=False, sort_keys=False)
                  if existing_path.read_text() == content:
                      skipped.append(slug)
                  else:
                      existing_path.write_text(content)
                      updated.append(slug)
              else:
                  # New product — create in also-available by default.
                  write_path = base / "also-available" / f"{slug}.yml"
                  write_path.parent.mkdir(parents=True, exist_ok=True)
                  content = yaml.dump(update, allow_unicode=True, default_flow_style=False, sort_keys=False)
                  write_path.write_text(content)
                  created.append(slug)

          print(f"created={len(created)} updated={len(updated)} skipped={len(skipped)}")
          for s in created:
              print(f"  created: {s}")
          for s in updated:
              print(f"  updated: {s}")

          # Write summary for PR body
          summary_lines = []
          if created:
              summary_lines.append("**Created:**")
              summary_lines += [f"- `{s}`" for s in created]
          if updated:
              summary_lines.append("**Updated:**")
              summary_lines += [f"- `{s}`" for s in updated]
          if skipped:
              summary_lines.append(f"**Unchanged:** {len(skipped)} product(s)")

          Path("/tmp/pr-summary.md").write_text("\n".join(summary_lines) + "\n")

          # Signal whether there are changes
          has_changes = bool(created or updated)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_changes={'true' if has_changes else 'false'}\n")
          EOF

      - name: Create PR
        if: steps.write.outputs.has_changes == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="sync/recipes-${DATE}-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add content/products/
          git commit -m "sync: update products from recipes ${DATE}"
          git push origin "$BRANCH"

          BODY=$(cat /tmp/pr-summary.md)
          gh pr create \
            --title "sync: update products from recipes ${DATE}" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes
        if: steps.write.outputs.has_changes != 'true'
        run: echo "All products are up to date — no PR needed."
