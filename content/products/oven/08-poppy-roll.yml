sections:
- title: Origin
  content: 'Mohnstriezel is a classic of German baking—soft yeast dough rolled around
    a sweet poppy seed filling, a staple of bakeries and café counters across Germany.
    Poppy seed baking has deep roots in German and Central European tradition, where
    the tiny seeds are ground sweet and rich to make one of the most beloved fillings
    in the pastry case. Oma''s version wraps the filling in a tender yeast dough and
    finishes it the traditional way: almond streusel and an apricot glaze.'
- title: Perfect For
  content: A slice of Mohnstriezel belongs on the Kaffee und Kuchen table—afternoon
    coffee with something homemade. It also travels well for brunches, school events,
    or as a gift that tastes like a German bakery counter. Pairs beautifully with
    plain coffee; the streusel and glaze bring enough sweetness that nothing else
    is needed.
- title: Availability
