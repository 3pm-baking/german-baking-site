sections:
  - title: Origin
    content: A gluten-free spin on a classic recipe from Oma Anneliese, this beloved family favorite has been cherished by generations. This traditional Zitronenkuchen brings bright citrus flavor with a tender, moist crumb—proof that gluten-free German baking can be just as delicious as the original.
  
  - title: Perfect For
    content: Ideal for coffee shops and markets seeking gluten-free dessert options that don't compromise on authentic flavor. A crowd-pleaser for all dietary needs.
