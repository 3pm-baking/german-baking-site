sections:
- title: Origin
  content: A gluten-free spin on a classic recipe from Oma Anneliese, this beloved
    family favorite has been cherished by generations. This traditional Zitronenkuchen
    brings bright citrus flavor with a tender, moist crumb—proof that gluten-free
    German baking can be just as delicious as the original.
- title: Availability
  content: Available at <a href="../index.html#find-us">local Asheville-area farmers
    markets</a>. Contact us for direct orders or wholesale inquiries.
- title: Perfect For
  content: Ideal for coffee shops and markets seeking gluten-free dessert options
    that don't compromise on authentic flavor. A crowd-pleaser for all dietary needs.
