sections:
  - title: Origin
    content:
      A beloved classic from German café culture, Käsekuchen has been a centerpiece
      of afternoon coffee and cake—Kaffee und Kuchen—for generations. Unlike American
      cheesecake, the German version uses quark, a fresh dairy product, which gives
      it a lighter, creamier texture and a delicate tang. This recipe follows the traditional
      method Oma used, perfected over decades.
  - title: Perfect For
    content:
      A crowd-pleaser at any gathering, afternoon coffee, birthday celebration,
      or farmers market. The familiar creaminess of cheesecake combined with its distinctly
      European character makes it approachable for all ages. Gluten-free option available—just
      ask at the market.
  - title: Availability
    content:
      Available at <a href="../index.html#find-us">local Asheville-area farmers
      markets</a>. Contact us for direct orders, custom sizing for events, or wholesale
      inquiries.
  - title: Allergen Information
    type: allergens
    content: Dairy, Eggs, Wheat. Gluten-free crust option available on request.
