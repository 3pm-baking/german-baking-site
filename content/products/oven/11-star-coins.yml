sections:
- title: Origin
  content: 'Sternentaler—star coins—are the kind of pastry German bakery counters
    sell by the tray: rounds of quark-oil dough baked up tender, then topped with
    plums, cherry jam, and a crumble of streusel. Quark-oil dough is a German bakery
    staple, a quick dough that bakes crisp at the edge and stays tender underneath
    the fruit. Oma''s version keeps the toppings generous and the glaze glossy.'
- title: Perfect For
  content: Hand-held and cheerful, these are the pastry for market strolls, brunch
    tables, and lunchboxes. Gluten-free without compromise, so everyone picks one
    up. They pair well with coffee in the morning and are just as welcome with afternoon
    tea.
- title: Availability
  content: Available at <a href="../index.html#find-us">local Asheville-area farmers
    markets</a>. Contact us for direct orders, custom sizing for events, or wholesale
    inquiries.
- title: Allergen Information
  type: allergens
  content: Eggs, Dairy. Gluten-free.
