sections:
- title: Origin
  content: This gluten-free almond ricotta cake combines the nutty richness of almond
    flour with the creamy texture of ricotta, brightened with orange zest. It's a
    naturally flourless cake that proves gluten-free baking can be every bit as satisfying
    as the original.
- title: Perfect For
  content: An excellent choice for those seeking naturally gluten-free desserts without
    compromise. Pairs beautifully with coffee or tea, and its moist, tender crumb
    makes it a standout at farmers markets and brunch tables.
- title: Availability
  content: Available at <a href="../index.html#find-us">local Asheville-area farmers
    markets</a>. Contact us for direct orders or catering inquiries.
- title: Allergen Information
  type: allergens
  content: Dairy (ricotta), Eggs, Almonds (tree nuts). Naturally gluten-free.
