sections:
- title: Origin
  content: This gluten-free quiche showcases the best of each season's harvest in a tender almond flour crust. Inspired by the German tradition of hearty savory tarts (herzhafte Quiches), it's a versatile option that changes with the farmer's market offerings throughout the year.
- title: Perfect For
  content: An ideal choice for lunch, brunch, or a light dinner. The almond crust provides a nutty complement to the seasonal filling, making it satisfying for both gluten-free and conventional eaters alike.
- title: Availability
  content: Available at <a href="../index.html#find-us">local Asheville-area farmers markets</a>. Seasonal availability — contact us for what's currently in rotation.
- title: Allergen Information
  type: allergens
  content: Dairy, Eggs, Almonds (tree nuts). Naturally gluten-free.
