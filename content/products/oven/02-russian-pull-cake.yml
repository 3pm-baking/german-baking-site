sections:
- title: Origin
  content: Despite its name, this beloved cake is entirely a German creation. The
    "Russischer" (Russian) name is thought to be a nostalgic nod to Eastern European
    flavor influences in post-war German baking. The "Zupf" refers to the pulled or
    plucked chocolate dough that forms the signature crumbled topping—baked over a
    smooth quark cheesecake layer for a beautiful contrast of textures. It has been
    a staple of German bakeries and home kitchens for decades.
- title: Perfect For
  content: Anyone who loves both chocolate cake and cheesecake will find this irresistible.
    The dramatic two-tone appearance makes it a showstopper at markets and events.
    Gluten-free option available on request.
- title: Availability
  content: Available at <a href="../index.html#find-us">local Asheville-area farmers
    markets</a>. Contact us for direct orders, custom sizing for events, or wholesale
    inquiries.
- title: Allergen Information
