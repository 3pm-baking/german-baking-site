sections:
  - title: What It Is
    content: Vanillezucker is in nearly every German baking recipe—it is the subtle, fragrant backbone behind so many classic flavors. True German vanilla sugar is made by resting real vanilla beans in fine sugar, infusing it with a warm, floral aroma that vanilla extract alone cannot replicate. A small packet adds an unmistakably authentic character to everything from Kipferl to Käsekuchen. Naturally gluten-free and dairy-free.

  - title: How to Use
    content: Use anywhere you would add vanilla extract or plain sugar in a baking recipe. Especially at home in Plätzchen (German Christmas cookies), whipped cream, Streusel toppings, and cake batters. One standard German packet (typically 8g) is equivalent to roughly one teaspoon of vanilla extract.

  - title: Availability
    content: Available at <a href="../index.html#find-us">local Asheville-area farmers markets</a> while supplies last. Contact us for direct orders or wholesale inquiries.

  - title: Allergen Information
    type: allergens
    content: Naturally gluten-free and dairy-free. Contains vanilla bean. Check packaging for full ingredient details.
