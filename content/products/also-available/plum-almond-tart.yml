sections:
- title: Origin
  content: 'The Zwetschgen-Mandel-Tarte pairs two German baking traditions: the almond
    tart and late-summer plum season. Zwetschgen—the small, dark-blue plums that flood
    German markets from August through October—are the classic fruit of German tarts
    and cakes. Oma''s version sets them on a nutty almond shortcrust and crowns them
    with cinnamon almond streusel, a combination that lets the plums stay the star.'
- title: Perfect For
  content: Naturally gluten-free and plant-based without anyone missing the wheat
    or butter—this is the tart to bring when the table has dietary needs and you don't
    want anyone to feel like an afterthought. Equally at home on the Kaffee und Kuchen
    table, at a farmers market stall, or as a dessert with whipped cream for those
    who can have it.
- title: Availability
  content: Available at <a href="../index.html#find-us">local Asheville-area farmers
    markets</a>. Contact us for direct orders, custom sizing for events, or wholesale
    inquiries.
- title: Allergen Information
  type: allergens
  content: Nuts (almond). Gluten-free and plant-based.
