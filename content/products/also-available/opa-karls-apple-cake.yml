sections:
- title: Origin
  content: 'This Feiner Apfelkuchen comes from Apfelbauer Ernst-Walther Süss—an apple
    farmer in Germany whose orchard fruit defines the cake. Tender sponge, apples
    arranged in a wreath on top, and a shiny apricot glaze: the kind of straightforward,
    perfect apple cake that German bakery counters are known for. Opa Karl''s name
    on it says everything about where the recipe lives in the family.'
- title: Perfect For
  content: The Kaffee und Kuchen classic—afternoon coffee with a slice that tastes
    like a German orchard. Gluten-free without compromise, so everyone at the table
    gets the same cake. Also lovely slightly warm with a spoonful of plain yogurt
    or cream.
- title: Availability
